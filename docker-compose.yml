services:
  computer:
    build: ./computer
    image: yourdaas/computer:local
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080" # noVNC (desktop in the browser)
      - "127.0.0.1:${FILE_API_PORT:-7071}:7071" # file API (MVP)
      - "127.0.0.1:${AUDIO_PORT:-7072}:7072" # audio bridge (duplex, loopback only; host-side knob only)
    volumes:
      - yourdaas-home:/home/user
      # Guest clock follows the host (user's timezone).
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Force another timezone without touching the host, e.g. TZ=America/Sao_Paulo
      - TZ=${TZ:-}
    restart: unless-stopped

  web:
    build: ./web
    image: yourdaas/web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      - computer
    restart: unless-stopped

volumes:
  yourdaas-home:
