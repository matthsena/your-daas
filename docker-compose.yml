services:
  computer:
    build: ./computer
    image: yourdaas/computer:local
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080" # noVNC (desktop in the browser)
      - "127.0.0.1:${FILE_API_PORT:-7071}:7071" # file API (MVP)
      - "127.0.0.1:${AUDIO_PORT:-7072}:7072" # audio bridge (duplex, loopback only; host-side knob only)
    volumes:
      - yourdaas-home:/home/user
      # Guest clock follows the host (user's timezone).
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Force another timezone without touching the host, e.g. TZ=America/Sao_Paulo
      - TZ=${TZ:-}
    restart: unless-stopped

  web:
    build: ./web
    image: yourdaas/web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      - computer
    restart: unless-stopped

  # Control plane: auth + per-user desktops + suspend + snapshots + shares.
  # Needs the Docker socket to manage user computers (see SECURITY.md).
  control:
    build: ./control
    image: yourdaas/control:local
    ports:
      - "127.0.0.1:${CONTROL_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - yourdaas-control-data:/data
      - yourdaas-snapshots:/snapshots
    environment:
      - TZ=${TZ:-}
      - NET_NAME=${NET_NAME:-your-daas_default}
      - IDLE_MINUTES=${IDLE_MINUTES:-30}
    restart: unless-stopped

volumes:
  yourdaas-home:
  yourdaas-control-data:
  # Explicit name: control resolves it as yourdaas-snapshots for helpers.
  yourdaas-snapshots:
    name: yourdaas-snapshots
