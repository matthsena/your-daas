name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose configs are valid
        run: |
          docker compose config --quiet
          TUNNEL_TOKEN=dummy docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Shell and Python syntax
        run: |
          bash -n computer/start.sh
          bash -n deploy/r2-backup.sh
          python3 -m py_compile computer/file-api.py
          python3 -m py_compile control/server.py control/db.py control/totp.py control/docker.py

      - name: Control-plane unit tests (VNC view filter)
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "control")
          from server import vnc_frame_dropped as f
          cases = [
              ("view", 0x2, 4, True), ("view", 0x2, 5, True), ("view", 0x2, 6, True),
              ("view", 0x2, 3, False), ("view", 0x2, 0, False), ("view", 0x1, 4, False),
              ("full", 0x2, 4, False), ("control", 0x2, 6, False),
          ]
          for mode, op, fb, exp in cases:
              got = f(mode, op, bytes([fb]))
              assert got == exp, (mode, op, fb, got, exp)
          print("vnc filter: all pass")
          EOF

      - name: Build computer image
        run: docker build -t yourdaas/computer:ci ./computer

      - name: Build web client
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build web image
        run: docker build -t yourdaas/web:ci ./web

      - name: Build control image
        run: docker build -t yourdaas/control:ci ./control

      - name: No secrets in tree
        # ci.yml and r2-backup.sh name the patterns/env-vars themselves;
        # they carry no values, so they are excluded from their own scan.
        run: |
          ! grep -rniE "BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}" \
            --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist \
            --exclude=r2-backup.sh . || exit 1
