resolver 127.0.0.11 valid=5s;

server {
  listen 80;
  client_max_body_size 1024m;
  root /usr/share/nginx/html;
  index index.html;

  # Upstream variables resolve at request time so nginx starts
  # even when a backend container is down (fail per-request, not boot).
  set $computer_upstream computer:6080;
  set $audio_upstream computer:7072;
  set $api_upstream computer:7071;
  set $control_upstream control:8080;

  location / {
    try_files $uri /index.html;
  }

  location /novnc/ {
    rewrite ^/novnc/(.*)$ /$1 break;
    proxy_pass http://$computer_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /websockify {
    proxy_pass http://$computer_upstream/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /audio/ {
    rewrite ^/audio/(.*)$ /$1 break;
    proxy_pass http://$audio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /api/ {
    proxy_pass http://$api_upstream;
  }

  # Control plane: auth API + per-user proxy (/u/<user>/...).
  # Fast upstream failure: the client treats a dead control as legacy mode.
  location /c/ {
    proxy_pass http://$control_upstream;
    proxy_connect_timeout 2s;
  }
  location /u/ {
    proxy_pass http://$control_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
