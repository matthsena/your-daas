<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>YourDaaS computer</title>
    <style>
      html,
      body,
      #screen {
        margin: 0;
        height: 100%;
        width: 100%;
        background: #0e0e10;
        overflow: hidden;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font: 12px system-ui, sans-serif;
        color: #a1a1aa;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #status.show { opacity: 1; }
      #clipview {
        position: fixed;
        right: 8px;
        bottom: 8px;
        max-width: 320px;
        max-height: 160px;
        overflow: auto;
        display: none;
        background: rgba(10, 10, 12, 0.92);
        color: #e8e8ea;
        border: 1px solid #333338;
        border-radius: 8px;
        padding: 8px 10px;
        font: 12px system-ui, sans-serif;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      #clipview.show { display: block; }
      #clipview button {
        display: block;
        margin-top: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #e8e8ea;
        border: 1px solid #333338;
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
        font: 12px system-ui, sans-serif;
      }
    </style>
    <script type="module">
      import RFB from "./core/rfb.js";

      function query(name, fallback) {
        const m = `${document.location.href}${window.location.hash}`.match(
          new RegExp(`.*[?&]${name}=([^&#]*)`),
        );
        return m ? decodeURIComponent(m[1]) : fallback;
      }
      function flag(name) {
        const v = String(query(name, "false")).toLowerCase();
        return v === "1" || v === "true" || v === "yes";
      }

      const status = document.getElementById("status");
      const show = (msg) => {
        if (!status) return;
        status.textContent = msg;
        status.classList.add("show");
        clearTimeout(show.t);
        show.t = setTimeout(() => status.classList.remove("show"), 4000);
      };

      // Websocket no mesmo origin (nginx/vite fazem proxy de /websockify).
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const url = `${protocol}://${window.location.host}/websockify`;

      const rfb = new RFB(document.getElementById("screen"), url);
      rfb.viewOnly = flag("view_only");
      rfb.scaleViewport = true;
      rfb.clipViewport = false;
      rfb.addEventListener("connect", () => show("connected"));
      rfb.addEventListener("disconnect", (e) => {
        // No popup: subtle notice only. Reload the iframe to reconnect.
        show(e.detail.clean ? "disconnected" : "connection lost — use Reconnect");
      });
      // Focus the canvas so keystrokes go straight to the desktop.
      rfb.addEventListener("connect", () => {
        const canvas = document.querySelector("#screen canvas");
        if (canvas) {
          canvas.tabIndex = 0;
          canvas.focus({ preventScroll: true });
        }
      });
      document.getElementById("screen").addEventListener("click", () => {
        const canvas = document.querySelector("#screen canvas");
        if (canvas) canvas.focus({ preventScroll: true });
      });
      // Without this, right-click opens the browser menu instead of reaching VNC.
      document.getElementById("screen").addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });
      // Backspace with focus on the page itself navigates back in some
      // browsers (session lost). Swallow it unless an editable element is
      // focused. The event still reaches noVNC, so remote Backspace works.
      window.addEventListener(
        "keydown",
        (event) => {
          if (event.key !== "Backspace") return;
          const t = event.target;
          const editable =
            t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
          if (!editable) event.preventDefault();
        },
        true,
      );

      // ---- Two-way clipboard (text + images), no buttons needed ----
      // Ctrl+C INSIDE Linux: x11vnc pushes the text via the RFB
      // `clipboard` event and we write it straight to the PC clipboard
      // (writes are allowed without a gesture in a secure context).
      // Ctrl+V IN the viewer: the keydown counts as user activation, so we
      // can read the PC clipboard and inject it into Linux (the browser
      // asks permission only the first time).
      // Images (both directions) go through the file-api X bridge
      // (docs/CLIPBOARD.md): VNC clipboard is text-only.
      const CTRL = 0xffe3;
      const KEY_V = 0x76;
      const clipView = document.getElementById("clipview");
      let lastRemote = "";
      // file-api base: same host on :7071 in dev (viewer served on :6080),
      // same-origin /api when proxied.
      const apiBase = (() => {
        const { protocol, hostname, port } = window.location;
        if (port === "6080") return `${protocol}//${hostname}:7071`;
        return "";
      })();
      let lastRemoteImg = "";
      let lastSeenTextHash = "";
      let lastSentTextHash = "";
      let lastSentImgHash = "";
      let remoteBaseline = false;
      let polling = false;

      function rfbReady() {
        return rfb && !rfb.viewOnly && typeof rfb.clipboardPasteFrom === "function";
      }
      function sendRemotePaste() {
        if (typeof rfb.sendKey !== "function") return;
        rfb.sendKey(CTRL, "ControlLeft", true);
        rfb.sendKey(KEY_V, "KeyV", true);
        rfb.sendKey(KEY_V, "KeyV", false);
        rfb.sendKey(CTRL, "ControlLeft", false);
      }
      function pasteHostText(text) {
        return postHostText(text);
      }
      // Host text -> Linux through the file-api X bridge (exact UTF-8).
      // noVNC's clipboardPasteFrom truncates to Latin-1 bytes, which drops
      // accents, so it is not used for text anymore.
      async function sha1hex(data) {
        try {
          const buf = typeof data === "string" ? new TextEncoder().encode(data) : data;
          const d = await crypto.subtle.digest("SHA-1", buf);
          return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
        } catch {
          return "";
        }
      }
      async function postHostText(text) {
        if (!rfbReady() || !text) return false;
        try {
          const res = await fetch(`${apiBase}/api/clipboard/text`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (!res.ok) return false;
        } catch {
          return false;
        }
        lastSentTextHash = await sha1hex(text);
        sendRemotePaste();
        return true;
      }
      // Ctrl+V with the viewer focused: read the PC clipboard and inject into Linux.
      // preventDefault here keeps the `paste` handler below from double-pasting.
      window.addEventListener(
        "keydown",
        async (event) => {
          if (rfb.viewOnly) return;
          if (!(event.ctrlKey || event.metaKey)) return;
          if (event.code !== "KeyV" || event.repeat) return;
          event.preventDefault();
          event.stopPropagation();
          // Images first: clipboard.read() needs this keydown gesture.
          // No image (or denied) falls through to the text path below.
          try {
            if (navigator.clipboard?.read) {
              const items = await navigator.clipboard.read();
              for (const item of items) {
                const type = item.types.find((t) => t.startsWith("image/"));
                if (!type) continue;
                const png = await toPng(await item.getType(type));
                if (!png) continue;
                if (png.size > 5 * 1024 * 1024) {
                  show("image too large (5MB max)");
                  return;
                }
                const up = await fetch(`${apiBase}/api/clipboard/image`, {
                  method: "POST",
                  headers: { "Content-Type": "image/png" },
                  body: png,
                });
                if (!up.ok) continue;
                lastSentImgHash = await sha1hex(await png.arrayBuffer());
                show("image sent to Linux");
                sendRemotePaste();
                return;
              }
            }
          } catch {
            /* denied/unavailable: fall through to text */
          }
          try {
            const text = await navigator.clipboard?.readText();
            if (await postHostText(text)) show("pasted into Linux");
            else show("nothing to paste");
          } catch {
            void clipboardReadState().then((s) => {
              if (s === "denied") showClipboardGuide();
              else show("allow clipboard access and try again");
            });
          }
        },
        true,
      );
      // Fallback for menu/gesture paste (when the keydown misses).
      window.addEventListener(
        "paste",
        (event) => {
          if (rfb.viewOnly) return;
          const text =
            event.clipboardData?.getData("text/plain") ||
            event.clipboardData?.getData("text") ||
            "";
          if (!text) return;
          event.preventDefault();
          event.stopPropagation();
          pasteHostText(text).then((ok) => {
            if (ok) show("pasted into Linux");
          });
        },
        true,
      );
      // Text copied INSIDE Linux: try to reach the PC clipboard with no
      // click (execCommand needs no gesture; the async API is plan B).
      // Only show the panel if everything fails — and then the text comes
      // pre-selected, so one Ctrl+C finishes the job.
      function legacyCopy(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;opacity:0;pointer-events:none;";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch {
          return false;
        }
      }
      function selectPanelText() {
        try {
          const range = document.createRange();
          range.selectNodeContents(clipView);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        } catch {
          /* ignore */
        }
      }
      function showPanelFallback() {
        clipView.textContent = lastRemote;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "copy";
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard?.writeText(lastRemote);
            show("copied to this PC");
            clipView.classList.remove("show");
          } catch {
            show("select the text and press Ctrl+C");
            selectPanelText();
          }
        });
        clipView.appendChild(btn);
        clipView.classList.add("show");
        selectPanelText();
        clearTimeout(clipView.t);
        clipView.t = setTimeout(() => clipView.classList.remove("show"), 15000);
      }
      // The RFB clipboard event is only a wake-up call: its payload is
      // Latin-1-decoded bytes (accents mojibake, images arrive as binary
      // garbage), so it is never written anywhere. The poll below fetches
      // the true clipboard state (exact UTF-8 / PNG) instead.
      rfb.addEventListener("clipboard", () => {
        void pollRemoteNow();
      });
      // Images copied INSIDE Linux: poll the X bridge (VNC carries no
      // images). New hash -> fetch PNG -> write to the PC clipboard, else
      // a transient panel with a thumbnail + copy button.
      function toPng(blob) {
        return new Promise((resolve) => {
          const img = new Image();
          const url = URL.createObjectURL(blob);
          img.onload = () => {
            try {
              const c = document.createElement("canvas");
              c.width = img.naturalWidth;
              c.height = img.naturalHeight;
              c.getContext("2d").drawImage(img, 0, 0);
              c.toBlob((b) => {
                URL.revokeObjectURL(url);
                resolve(b);
              }, "image/png");
            } catch {
              URL.revokeObjectURL(url);
              resolve(null);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve(null);
          };
          img.src = url;
        });
      }
      function showImagePanel(blob) {
        clipView.innerHTML = "";
        const img = document.createElement("img");
        img.src = URL.createObjectURL(blob);
        img.alt = "Image copied inside Linux";
        img.style.cssText = "max-width:100%;max-height:120px;display:block;border-radius:6px;";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "copy image";
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard?.write([new ClipboardItem({ "image/png": blob })]);
            show("image copied to this PC");
            clipView.classList.remove("show");
          } catch {
            show("right-click the image and copy it");
          }
        });
        clipView.appendChild(img);
        clipView.appendChild(btn);
        clipView.classList.add("show");
        clearTimeout(clipView.t);
        clipView.t = setTimeout(() => clipView.classList.remove("show"), 15000);
      }
      async function pollRemoteNow() {
        if (rfb.viewOnly || polling) return;
        polling = true;
        try {
          let st = null;
          try {
            const res = await fetch(`${apiBase}/api/clipboard`);
            if (!res.ok) return;
            st = await res.json();
          } catch {
            return;
          }
          if (!st || st.kind === "none" || !st.hash) return;
          // First sighting only sets the baseline: never clobber the PC
          // clipboard on page load.
          if (!remoteBaseline) {
            remoteBaseline = true;
            if (st.kind === "image") lastRemoteImg = st.hash;
            if (st.kind === "text") lastSeenTextHash = st.hash;
            return;
          }
          if (st.kind === "image") {
            if (st.hash === lastRemoteImg || st.hash === lastSentImgHash) return;
            lastRemoteImg = st.hash;
            let blob = null;
            try {
              const res = await fetch(`${apiBase}/api/clipboard/image`);
              if (res.ok) blob = await res.blob();
            } catch {
              blob = null;
            }
            if (!blob) return;
            try {
              await navigator.clipboard?.write([new ClipboardItem({ "image/png": blob })]);
              show("image copied to this PC");
            } catch {
              showImagePanel(blob);
            }
            return;
          }
          if (st.kind === "text" && typeof st.text === "string") {
            if (st.hash === lastSeenTextHash || st.hash === lastSentTextHash) return;
            lastSeenTextHash = st.hash;
            lastRemote = st.text;
            if (legacyCopy(st.text)) {
              show("copied to this PC");
              return;
            }
            try {
              await navigator.clipboard?.writeText(st.text);
              show("copied to this PC");
            } catch {
              showPanelFallback();
            }
          }
        } finally {
          polling = false;
        }
      }
      setInterval(() => {
        if (!document.hidden) void pollRemoteNow();
      }, 2000);
      // Clipboard permission state: if the browser has it blocked, say so
      // persistently (with the fix) instead of failing every Ctrl+V silently.
      async function clipboardReadState() {
        try {
          const s = await navigator.permissions?.query({ name: "clipboard-read" });
          return s?.state || "unknown";
        } catch {
          return "unknown";
        }
      }
      function showClipboardGuide() {
        clipView.innerHTML = "";
        const p = document.createElement("div");
        p.textContent =
          "Clipboard is blocked: click the lock icon in the address bar, allow Clipboard, then reload the page.";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "dismiss";
        btn.addEventListener("click", () => clipView.classList.remove("show"));
        clipView.appendChild(p);
        clipView.appendChild(btn);
        clipView.classList.add("show");
        clearTimeout(clipView.t);
        clipView.t = setTimeout(() => clipView.classList.remove("show"), 20000);
      }
      void clipboardReadState().then((s) => {
        if (s === "denied") showClipboardGuide();
      });
    </script>
  </head>
  <body>
    <div id="screen"></div>
    <div id="status"></div>
    <div id="clipview" title="Text copied inside Linux"></div>
  </body>
</html>
